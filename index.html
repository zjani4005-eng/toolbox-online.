<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>InvoicePro</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f4f7fb;
color:#172033;
}

header{
background:#fff;
padding:18px 6%;
display:flex;
justify-content:space-between;
align-items:center;
border-bottom:1px solid #ddd;
}

.logo{
font-size:24px;
font-weight:bold;
color:#2563eb;
}

button{
border:0;
padding:11px 16px;
border-radius:8px;
cursor:pointer;
font-weight:bold;
}

.blue{
background:#2563eb;
color:white;
}

.green{
background:#16a34a;
color:white;
}

.light{
background:#eef2ff;
color:#2563eb;
}

.container{
max-width:1100px;
margin:auto;
padding:30px 18px;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:25px;
}

.card{
background:white;
padding:22px;
border-radius:16px;
box-shadow:0 5px 20px #0001;
}

label{
display:block;
font-weight:bold;
font-size:14px;
margin-top:14px;
}

input,select{
width:100%;
padding:11px;
margin-top:6px;
border:1px solid #ccd3df;
border-radius:8px;
outline:none;
}

input:focus,select:focus{
border-color:#2563eb;
}

.items{
margin-top:20px;
}

.item{
display:grid;
grid-template-columns:2fr .8fr 1fr auto;
gap:7px;
margin-bottom:8px;
}

.item input{
margin:0;
}

.remove{
background:#fee2e2;
color:#b91c1c;
padding:10px 13px;
}

.invoice{
padding:30px;
border:1px solid #ddd;
background:white;
min-height:500px;
}

.invoice-top{
display:flex;
justify-content:space-between;
border-bottom:2px solid #2563eb;
padding-bottom:20px;
}

.invoice h1{
color:#2563eb;
margin:0;
}

.meta{
text-align:right;
}

.status{
display:inline-block;
padding:5px 10px;
border-radius:20px;
background:#dcfce7;
color:#166534;
font-size:12px;
font-weight:bold;
}

.customer{
margin:25px 0;
}

table{
width:100%;
border-collapse:collapse;
}

th,td{
padding:10px;
border-bottom:1px solid #ddd;
text-align:left;
}

.total{
margin-left:auto;
width:250px;
margin-top:20px;
}

.total div{
display:flex;
justify-content:space-between;
padding:6px;
}

.grand{
border-top:2px solid #172033;
font-size:20px;
font-weight:bold;
padding-top:10px!important;
}

.actions{
display:flex;
gap:10px;
margin-top:15px;
flex-wrap:wrap;
}

.actions button{
flex:1;
min-width:150px;
}

@media(max-width:800px){

.grid{
grid-template-columns:1fr;
}

}

@media(max-width:550px){

.item{
grid-template-columns:1fr 1fr;
}

.itemName{
grid-column:1/-1;
}

.invoice-top{
flex-direction:column;
}

.meta{
text-align:left;
}

.invoice{
padding:18px;
}

}

@media print{

body{
background:white;
}

header,
.form,
.actions,
h2{
display:none!important;
}

.container{
padding:0;
max-width:none;
}

.grid{
display:block;
}

.card{
box-shadow:none;
padding:0;
}

.invoice{
border:0;
padding:20px;
}

}
</style>
</head>

<body>

<header>

<div class="logo">
InvoicePro
</div>

<button class="light" onclick="newInvoice()">
New Invoice
</button>

</header>


<div class="container">

<div class="grid">


<!-- FORM -->

<div class="card form">

<h2>Create Invoice</h2>

<label>Business Name</label>

<input
id="business"
placeholder="Your Business Name">


<label>Customer Name</label>

<input
id="customer"
placeholder="Customer Name">


<label>Customer Phone</label>

<input
id="phone"
placeholder="03XXXXXXXXX">


<label>Invoice Number</label>

<input
id="number"
value="INV-001">


<label>Date</label>

<input
id="date"
type="date">


<label>Payment Status</label>

<select id="status">

<option>Unpaid</option>
<option>Paid</option>
<option>Pending</option>

</select>


<div class="items">

<h3>Items</h3>

<div id="items"></div>

<button
class="light"
onclick="addItem()">

+ Add Item

</button>

</div>


<label>Tax (%)</label>

<input
id="tax"
type="number"
placeholder="Tax %"
value="0"
min="0"
step="0.01">


<label>Discount (%)</label>

<input
id="discount"
type="number"
placeholder="Discount %"
value="0"
min="0"
step="0.01">


<br>

<button
class="blue"
onclick="updateInvoice()">

Update Invoice

</button>

</div>


<!-- PREVIEW -->

<div class="card">

<h2>Invoice Preview</h2>

<div
class="invoice"
id="invoice">


<div class="invoice-top">

<div>

<h1>INVOICE</h1>

<p id="previewBusiness">
Your Business Name
</p>

</div>


<div class="meta">

<strong id="previewNumber">
INV-001
</strong>

<br>

<span id="previewDate"></span>

<br><br>

<span
class="status"
id="previewStatus">

Unpaid

</span>

</div>

</div>


<div class="customer">

<strong>Bill To:</strong>

<div id="previewCustomer">
Customer Name
</div>

<div id="previewPhone"></div>

</div>


<table>

<thead>

<tr>

<th>Item</th>
<th>Quantity</th>
<th>Price</th>
<th>Total</th>

</tr>

</thead>

<tbody
id="previewItems">

</tbody>

</table>


<div class="total">

<div>

<span>Subtotal</span>

<strong id="subtotal">
Rs. 0
</strong>

</div>


<div>

<span>Discount</span>

<strong id="discountAmount">
Rs. 0
</strong>

</div>


<div>

<span>Tax</span>

<strong id="taxAmount">
Rs. 0
</strong>

</div>


<div class="grand">

<span>Total</span>

<strong id="grandTotal">
Rs. 0
</strong>

</div>

</div>

</div>


<div class="actions">

<button
class="green"
onclick="downloadPicture()">

🖼️ Download Picture

</button>


<button
class="blue"
onclick="printInvoice()">

🖨️ Print / PDF

</button>

</div>

</div>

</div>

</div>


<!-- IMAGE GENERATOR -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js">
</script>


<script>

let itemNumber=0;


/* DATE */

function today(){

let d=new Date();

let month=
String(d.getMonth()+1).padStart(2,"0");

let day=
String(d.getDate()).padStart(2,"0");

return d.getFullYear()
+"-"+month
+"-"+day;

}

document.getElementById("date").value=today();


/* ADD ITEM */

function addItem(){

itemNumber++;

let item=document.createElement("div");

item.className="item";

item.id="item"+itemNumber;

item.innerHTML=`

<input
class="itemName"
placeholder="Item Name / Service">

<input
class="itemQty"
type="number"
min="1"
placeholder="Quantity">

<input
class="itemPrice"
type="number"
min="0"
placeholder="Price">

<button
class="remove"
onclick="removeItem(${itemNumber})">

×

</button>

`;

document
.getElementById("items")
.appendChild(item);


item
.querySelectorAll("input")
.forEach(input=>{

input.addEventListener(
"input",
updateInvoice
);

});


updateInvoice();

}


/* REMOVE ITEM */

function removeItem(id){

let item=
document.getElementById(
"item"+id
);

if(item){
item.remove();
}

updateInvoice();

}


/* MONEY */

function money(number){

return "Rs. "+
Number(number)
.toLocaleString(
"en-PK",
{
maximumFractionDigits:2
}
);

}


/* UPDATE */

function updateInvoice(){

document.getElementById(
"previewBusiness"
).textContent=

document.getElementById(
"business"
).value
||"Your Business Name";


document.getElementById(
"previewCustomer"
).textContent=

document.getElementById(
"customer"
).value
||"Customer Name";


document.getElementById(
"previewPhone"
).textContent=

document.getElementById(
"phone"
).value;


document.getElementById(
"previewNumber"
).textContent=

document.getElementById(
"number"
).value
||"INV-001";


document.getElementById(
"previewDate"
).textContent=

document.getElementById(
"date"
).value
||today();


document.getElementById(
"previewStatus"
).textContent=

document.getElementById(
"status"
).value;


let subtotal=0;

let html="";


document
.querySelectorAll(".item")
.forEach(item=>{

let name=
item.querySelector(
".itemName"
).value
||"Item";

let qty=
Number(
item.querySelector(
".itemQty"
).value
)
||0;

let price=
Number(
item.querySelector(
".itemPrice"
).value
)
||0;

let total=qty*price;

subtotal+=total;


html+=`

<tr>

<td>
${escapeHTML(name)}
</td>

<td>
${qty}
</td>

<td>
${money(price)}
</td>

<td>
${money(total)}
</td>

</tr>

`;

});


document.getElementById(
"previewItems"
).innerHTML=html;


let discountRate=
Number(
document.getElementById(
"discount"
).value
)
||0;


let taxRate=
Number(
document.getElementById(
"tax"
).value
)
||0;


let discount=
subtotal*
discountRate/100;


let taxable=
subtotal-discount;


let tax=
taxable*
taxRate/100;


let total=
taxable+tax;


document.getElementById(
"subtotal"
).textContent=
money(subtotal);


document.getElementById(
"discountAmount"
).textContent=
money(discount);


document.getElementById(
"taxAmount"
).textContent=
money(tax);


document.getElementById(
"grandTotal"
).textContent=
money(total);

}


/* SAFE TEXT */

function escapeHTML(text){

return String(text)

.replaceAll("&","&amp;")

.replaceAll("<","&lt;")

.replaceAll(">","&gt;")

.replaceAll('"',"&quot;")

.replaceAll("'","&#039;");

}


/* DOWNLOAD PICTURE */

async function downloadPicture(){

updateInvoice();

if(typeof html2canvas==="undefined"){

alert(
"Image system load nahi hua. Internet connection check karein."
);

return;

}


try{

const invoice=
document.getElementById("invoice");


const canvas=
await html2canvas(
invoice,
{
scale:3,
backgroundColor:"#ffffff",
useCORS:true
}
);


const link=
document.createElement("a");


let invoiceNumber=
document.getElementById(
"number"
).value
||"invoice";


link.download=
invoiceNumber+".png";


link.href=
canvas.toDataURL(
"image/png"
);


document.body.appendChild(link);

link.click();

link.remove();

}

catch(error){

console.error(error);

alert(
"Picture download nahi ho saki. Dobara try karein."
);

}

}


/* PRINT / PDF */

function printInvoice(){

updateInvoice();

window.print();

}


/* NEW INVOICE */

function newInvoice(){

document.getElementById(
"business"
).value="";

document.getElementById(
"customer"
).value="";

document.getElementById(
"phone"
).value="";

document.getElementById(
"number"
).value="INV-001";

document.getElementById(
"date"
).value=today();

document.getElementById(
"status"
).value="Unpaid";

document.getElementById(
"tax"
).value="0";

document.getElementById(
"discount"
).value="0";


document.getElementById(
"items"
).innerHTML="";


itemNumber=0;

addItem();

}


/* LIVE UPDATE */

[
"business",
"customer",
"phone",
"number",
"date",
"status",
"tax",
"discount"

].forEach(id=>{

let element=
document.getElementById(id);

element.addEventListener(
"input",
updateInvoice
);

element.addEventListener(
"change",
updateInvoice
);

});


/* ONE EMPTY ITEM */

addItem();

updateInvoice();

</script>

</body>
</html>
