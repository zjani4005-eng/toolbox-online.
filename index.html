<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>InvoicePro</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f4f7fb;
color:#172033;
}

header{
background:white;
padding:18px 6%;
display:flex;
justify-content:space-between;
align-items:center;
border-bottom:1px solid #ddd;
}

.logo{
font-size:24px;
font-weight:bold;
color:#2563eb;
}

button{
border:0;
padding:11px 16px;
border-radius:8px;
cursor:pointer;
font-weight:bold;
}

.blue{
background:#2563eb;
color:white;
}

.light{
background:#eef2ff;
color:#2563eb;
}

.container{
max-width:1100px;
margin:auto;
padding:30px 18px;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:25px;
}

.card{
background:white;
padding:22px;
border-radius:16px;
box-shadow:0 5px 20px #0001;
}

label{
display:block;
font-weight:bold;
font-size:14px;
margin-top:14px;
}

input,select{
width:100%;
padding:11px;
margin-top:6px;
border:1px solid #ccd3df;
border-radius:8px;
}

.item{
display:grid;
grid-template-columns:2fr .7fr 1fr auto;
gap:7px;
margin-bottom:8px;
}

.item input{
margin:0;
}

.remove{
background:#fee2e2;
color:#b91c1c;
}

.invoice{
padding:30px;
border:1px solid #ddd;
background:white;
min-height:500px;
}

.invoice-top{
display:flex;
justify-content:space-between;
border-bottom:2px solid #2563eb;
padding-bottom:20px;
}

.invoice h1{
color:#2563eb;
margin:0;
}

.meta{
text-align:right;
}

.status{
display:inline-block;
padding:5px 10px;
border-radius:20px;
background:#dcfce7;
color:#166534;
font-size:12px;
font-weight:bold;
}

.customer{
margin:25px 0;
}

table{
width:100%;
border-collapse:collapse;
}

th,td{
padding:10px;
border-bottom:1px solid #ddd;
text-align:left;
}

.total{
margin-left:auto;
width:250px;
margin-top:20px;
}

.total div{
display:flex;
justify-content:space-between;
padding:6px;
}

.grand{
border-top:2px solid #172033;
font-size:20px;
font-weight:bold;
}

.actions{
display:flex;
gap:10px;
margin-top:15px;
}

@media(max-width:800px){
.grid{
grid-template-columns:1fr;
}
}

@media(max-width:550px){
.item{
grid-template-columns:1fr 1fr;
}

.invoice-top{
flex-direction:column;
}

.meta{
text-align:left;
}
}

@media print{
header,
.form,
.actions{
display:none!important;
}

.container{
padding:0;
}

.grid{
display:block;
}

.invoice{
border:0;
}
}
</style>
</head>

<body>

<header>

<div class="logo">
InvoicePro
</div>

<button class="light" onclick="newInvoice()">
New Invoice
</button>

</header>


<div class="container">

<div class="grid">


<!-- FORM -->

<div class="card form">

<h2>Create Invoice</h2>

<label>Business Name</label>
<input id="business" placeholder="Your Business Name">

<label>Customer Name</label>
<input id="customer" placeholder="Customer Name">

<label>Customer Phone</label>
<input id="phone" placeholder="03XXXXXXXXX">

<label>Invoice Number</label>
<input id="number" value="INV-001">

<label>Date</label>
<input id="date" type="date">

<label>Payment Status</label>

<select id="status">
<option>Unpaid</option>
<option>Paid</option>
<option>Pending</option>
</select>


<h3>Items</h3>

<div id="items"></div>

<button class="light" onclick="addItem()">
+ Add Item
</button>


<label>Tax %</label>
<input id="tax" type="number" value="0">


<label>Discount %</label>
<input id="discount" type="number" value="0">

<br><br>

<button class="blue" onclick="updateInvoice()">
Update Invoice
</button>

</div>


<!-- PREVIEW -->

<div class="card">

<h2>Invoice Preview</h2>

<div class="invoice">

<div class="invoice-top">

<div>
<h1>INVOICE</h1>
<p id="previewBusiness">
Your Business Name
</p>
</div>

<div class="meta">

<strong id="previewNumber">
INV-001
</strong>

<br>

<span id="previewDate"></span>

<br><br>

<span class="status" id="previewStatus">
Unpaid
</span>

</div>

</div>


<div class="customer">

<strong>Bill To:</strong>

<div id="previewCustomer">
Customer Name
</div>

<div id="previewPhone"></div>

</div>


<table>

<thead>

<tr>
<th>Item</th>
<th>Qty</th>
<th>Price</th>
<th>Total</th>
</tr>

</thead>

<tbody id="previewItems"></tbody>

</table>


<div class="total">

<div>
<span>total</span>
<strong id="total">Rs. 0</strong>
</div>

<div>
<span>Discount</span>
<strong id="discountAmount">Rs. 0</strong>
</div>

<div>
<span>Tax</span>
<strong id="taxAmount">Rs. 0</strong>
</div>

<div class="grand">
<span>Total</span>
<strong id="grandTotal">Rs. 0</strong>
</div>

</div>

</div>


<div class="actions">

<button class="blue" onclick="window.print()">
🖨️ Print / Save PDF
</button>

<button class="light" onclick="whatsapp()">
📱 WhatsApp
</button>

</div>

</div>

</div>

</div>


<script>

let itemNumber=0;


/* TODAY */

function today(){

let d=new Date();

let month=String(d.getMonth()+1).padStart(2,"0");

let day=String(d.getDate()).padStart(2,"0");

return d.getFullYear()+"-"+month+"-"+day;

}

document.getElementById("date").value=today();


/* ADD ITEM */

function addItem(name="",qty=1,price=0){

itemNumber++;

let item=document.createElement("div");

item.className="item";

item.id="item"+itemNumber;

item.innerHTML=`

<input
class="itemName"
placeholder="Service / Product"
value="${name}"
oninput="updateInvoice()">

<input
class="itemQty"
type="number"
value="${qty}"
min="1"
oninput="updateInvoice()">

<input
class="itemPrice"
type="number"
value="${price}"
min="0"
oninput="updateInvoice()">

<button
class="remove"
onclick="removeItem(${itemNumber})">
×
</button>

`;

document.getElementById("items").appendChild(item);

updateInvoice();

}


/* REMOVE */

function removeItem(id){

let item=document.getElementById("item"+id);

if(item){
item.remove();
}

updateInvoice();

}


/* MONEY */

function money(number){

return "Rs. "+
Number(number).toLocaleString("en-PK");

}


/* UPDATE */

function updateInvoice(){

document.getElementById("previewBusiness").textContent=

document.getElementById("business").value
||"Your Business Name";


document.getElementById("previewCustomer").textContent=

document.getElementById("customer").value
||"Customer Name";


document.getElementById("previewPhone").textContent=

document.getElementById("phone").value;


document.getElementById("previewNumber").textContent=

document.getElementById("number").value
||"INV-001";


document.getElementById("previewDate").textContent=

document.getElementById("date").value
||today();


document.getElementById("previewStatus").textContent=

document.getElementById("status").value;


let subtotal=0;

let html="";


document.querySelectorAll(".item").forEach(item=>{

let name=
item.querySelector(".itemName").value
||"Item";

let qty=
Number(item.querySelector(".itemQty").value)
||0;

let price=
Number(item.querySelector(".itemPrice").value)
||0;

let total=qty*price;

subtotal+=total;

html+=`

<tr>

<td>${name}</td>

<td>${qty}</td>

<td>${money(price)}</td>

<td>${money(total)}</td>

</tr>

`;

});


document.getElementById("previewItems").innerHTML=html;


let discountRate=
Number(document.getElementById("discount").value)
||0;

let taxRate=
Number(document.getElementById("tax").value)
||0;


let discount=
subtotal*discountRate/100;

let taxable=
subtotal-discount;

let tax=
taxable*taxRate/100;

let total=
taxable+tax;


document.getElementById("total").textContent=
money(subtotal);

document.getElementById("discountAmount").textContent=
money(discount);

document.getElementById("taxAmount").textContent=
money(tax);

document.getElementById("grandTotal").textContent=
money(total);

}


/* WHATSAPP */

function whatsapp(){

let phone=
document.getElementById("phone").value
.replace(/\D/g,"");

if(phone.startsWith("0")){
phone="92"+phone.substring(1);
}

let business=
document.getElementById("business").value
||"Business";

let customer=
document.getElementById("customer").value
||"Customer";

let total=
document.getElementById("grandTotal").textContent;


let message=
"Invoice from "+business+
"%0ACustomer: "+customer+
"%0ATotal: "+total;


window.open(
"https://wa.me/"+phone+
"?text="+message,
"_blank"
);

}


/* NEW */

function newInvoice(){

document.getElementById("business").value="";

document.getElementById("customer").value="";

document.getElementById("phone").value="";

document.getElementById("number").value="INV-001";

document.getElementById("date").value=today();

document.getElementById("status").value="Unpaid";

document.getElementById("tax").value="0";

document.getElementById("discount").value="0";

document.getElementById("items").innerHTML="";

itemNumber=0;

addItem();

}


/* DEFAULT ITEMS */

addItemname(
"",
1,

);

addItemname(
"",
1,

);


/* LIVE UPDATE */

[
"business",
"customer",
"phone",
"number",
"date",
"status",
"tax",
"discount"
].forEach(id=>{

document.getElementById(id)
.addEventListener("input",updateInvoice);

document.getElementById(id)
.addEventListener("change",updateInvoice);

});


updateInvoice();

</script>

</body>
</html>
